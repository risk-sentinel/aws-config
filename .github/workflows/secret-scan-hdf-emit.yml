name: Secret scan HDF emit (TruffleHog)

# Caller for the reusable secret-scan-hdf.yml in risk-sentinel/dev-sec-ops-baseline
# (dev-sec-ops-baseline#21).
#
# Companion to secret-scan.yml, which is the GATE. The gate answers "are there
# secrets" and stops; this converts the result to HDF so it joins the same
# evidence stream as SAST, SCA and the InSpec results.
#
# ---- New here, not a replacement -------------------------------------------
#
# This repository had the secret-scan GATE but never had an HDF emit, so its
# secret-scanning result existed in a workflow log and nowhere else. The other
# thirteen repositories are converting a copied workflow; this one is gaining
# the capability.
#
# The reusable emits a one-control HDF recording the execution even when the
# scan is clean, which is the normal case here — without that, a clean scan and
# a broken pipeline leave byte-for-byte identical state in the bucket.
#
# The fixture at tests/trufflehog-fixture is excluded via
# .trufflehog-exclude-paths. It exists to prove the GATE still fires, and
# recording its synthetic credential as real evidence would be worse than
# useless — it would need triaging out of the POA&M.
#
# Never runs on pull_request: a fork PR would run this with write-ish intent,
# and the evidence stream should only reflect what landed on the default branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * 1'   # weekly, offset from the gate's daily run
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  emit:
    uses: risk-sentinel/dev-sec-ops-baseline/.github/workflows/secret-scan-hdf.yml@v0.4.0
    with:
      boundary: ${{ vars.EVIDENCE_BOUNDARY || 'sparc' }}
    secrets:
      S3_EMIT_ROLE_ARN: ${{ secrets.AWS_CONFIG_EMIT_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      COMPLIANCE_S3_BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
