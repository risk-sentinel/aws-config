name: fetch-aws-config

# REUSABLE workflow (aws-config#1). Captures AWS Config rule-evaluation results as HDF
# evidence and stamps the workload/target into the HDF passthrough.
#
# This repo holds the workflow + variables but NO AWS role / credentials of its own.
# The CALLER (sparc-validate) invokes it via `uses:` and passes its scanner-role ARN +
# the org DOCKERHUB secrets. Because it's a reusable workflow, the OIDC token is minted
# as the caller (repo:risk-sentinel/sparc-validate:*), so the existing scanner-role trust
# matches — no new role, no aws-config trust. See README + sparc-validate#194.

on:
  workflow_call:
    inputs:
      regions:
        description: 'JSON array of AWS regions to capture, e.g. ["us-east-1"]'
        type: string
        default: '["us-east-1"]'
      output_prefix:
        description: 'Artifact filename prefix'
        type: string
        default: aws-config
      workload_name:
        description: 'Workload identity stamped into the HDF passthrough'
        type: string
        default: sparc-aws-config
    secrets:
      AWS_ROLE_ARN:
        description: 'Caller role to assume (e.g. the sparc-validate scanner role) — needs AWS Config read + sts:GetCallerIdentity'
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  id-token: write   # OIDC (token minted as the caller repo)
  contents: read

jobs:
  fetch:
    name: AWS Config -> HDF
    runs-on: ubuntu-latest
    container:
      image: risksentinel/sparc-auditor:v0.1.5
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(inputs.regions) }}
    steps:
      - name: Configure AWS credentials via OIDC (caller's role)
        id: creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: aws-config-fetch-${{ github.run_id }}-${{ matrix.region }}
          aws-region: ${{ matrix.region }}

      - name: Build passthrough (workload + target identity)
        id: pass
        shell: bash
        env:
          ACCOUNT: ${{ steps.creds.outputs.aws-account-id }}
          REGION: ${{ matrix.region }}
          WORKLOAD: ${{ inputs.workload_name }}
        run: |
          # Stamped into each HDF's passthrough so the evidence self-identifies the
          # workload + AWS account/region it was collected from.
          cat > passthrough-${REGION}.json <<JSON
          {
            "workload": "${WORKLOAD}",
            "source": "aws-config",
            "target": {
              "name": "aws-account-${ACCOUNT}",
              "type": "aws_account",
              "account_id": "${ACCOUNT}",
              "region": "${REGION}"
            },
            "collected_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "github_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          echo "account=${ACCOUNT}" >> "$GITHUB_OUTPUT"

      - name: hdf fetch aws-config (primary — target + enrichment)
        shell: bash
        env:
          REGION: ${{ matrix.region }}
          ACCOUNT: ${{ steps.creds.outputs.aws-account-id }}
        run: |
          raw="${{ inputs.output_prefix }}-${ACCOUNT}-${REGION}.raw.json"
          art="${{ inputs.output_prefix }}-${ACCOUNT}-${REGION}.hdf.json"
          hdf fetch aws-config --region "${REGION}" -o "${raw}"
          [ -s "${raw}" ] || { echo "::error::no HDF produced (${raw}) — Config recording + role config:* read?"; exit 1; }
          # Validate the NATIVE fetch output (the hdf CLI validates its own new schema).
          # Informational — don't fail the job on a validate quirk.
          hdf validate "${raw}" || echo "::warning::hdf validate on the native fetch output reported issues"
          # Normalize the hdf-cli schema (baselines[]/requirements[]) down to the legacy
          # profiles[].controls[] HDF that the downstream failure_export / hdf_to_oscal.py
          # pipeline already consumes — no custom shape-handling needed (sparc-validate#194).
          # The .raw.json keeps the richer hdf-cli evidence (not uploaded; the .hdf.json is the
          # pipeline artifact). Going fully hdf-cli-native for OSCAL is the migration (sparc-validate#198).
          #
          # Do NOT `hdf validate` the downgraded output — the hdf CLI validates only its OWN
          # (new) schema and rejects its own --to hdf@1 legacy form ("baselines is required").
          # The correct check is that the pipeline shape (profiles[].controls[]) is present.
          hdf convert "${raw}" --to hdf@1 -o "${art}"
          [ -s "${art}" ] || { echo "::error::normalize (--to hdf@1) produced no output (${art})"; exit 1; }
          # Stamp the workload/target into the passthrough of the pipeline artifact.
          saf supplement passthrough write -i "${art}" -f "passthrough-${REGION}.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); n=sum(len(p.get('controls',[])) for p in d.get('profiles',[])); print(f'normalized {sys.argv[1]}: {n} controls') if (d.get('profiles') and n>0) else (print('::error::normalized HDF has no profiles[].controls[] — empty Config results / lossy downgrade?') or sys.exit(1))" "${art}"

      - name: saf aws_config2hdf (cross-check)
        shell: bash
        env:
          REGION: ${{ matrix.region }}
          ACCOUNT: ${{ steps.creds.outputs.aws-account-id }}
        run: |
          art="${{ inputs.output_prefix }}-${ACCOUNT}-${REGION}.saf.hdf.json"
          saf convert aws_config2hdf -r "${REGION}" -o "${art}"
          [ -s "${art}" ] || { echo "::error::no SAF HDF produced (${art})."; exit 1; }
          saf supplement passthrough write -i "${art}" -f "passthrough-${REGION}.json"
          # SAF emits native legacy profiles[].controls[] HDF — check that shape directly
          # (hdf validate only recognizes the new hdf-cli schema, not this legacy form).
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); n=sum(len(p.get('controls',[])) for p in d.get('profiles',[])); print(f'saf {sys.argv[1]}: {n} controls') if (d.get('profiles') and n>0) else (print('::error::SAF HDF has no profiles[].controls[]') or sys.exit(1))" "${art}"
          echo "saf -> ${art}"

      # The uploaded artifact IS "our output": the caller (sparc-validate) collects it
      # and its aggregate-failures step feeds the sparc-iac OSCAL/ATO pipeline, which
      # already ingests sparc-validate artifacts. (S3 archival, if ever wanted, is a
      # separate ubuntu-latest publish job — the scanner image has no aws CLI.)
      - name: Upload HDF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.output_prefix }}-${{ matrix.region }}
          path: ${{ inputs.output_prefix }}-*-${{ matrix.region }}*.hdf.json
          retention-days: 90
