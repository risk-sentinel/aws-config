name: fetch-aws-config

# REUSABLE workflow (aws-config#1). Captures AWS Config rule-evaluation results as HDF
# evidence and stamps the workload/target into the HDF passthrough.
#
# This repo holds the workflow + variables but NO AWS role / credentials of its own.
# The CALLER invokes it via `uses:` and passes its own scanner-role ARN + registry
# secrets. Because it's a reusable workflow, the OIDC token is minted as the caller
# (repo:<your-org>/<caller-repo>:*), so the caller's existing scanner-role trust
# matches — no new role, and no trust entry for this repo. See README.

on:
  workflow_call:
    inputs:
      regions:
        description: >-
          JSON array of AWS regions to capture, e.g. ["us-east-1"]. Required and
          deliberately undefaulted: a wrong region does not error, it captures an
          empty region and reports a clean result.
        type: string
        required: true
      output_prefix:
        description: 'Artifact filename prefix'
        type: string
        default: aws-config
      workload_name:
        description: 'Workload identity stamped into the HDF passthrough'
        type: string
        default: sparc-aws-config
    secrets:
      AWS_ROLE_ARN:
        description: 'Caller role to assume (e.g. the sparc-validate scanner role) — needs AWS Config read + sts:GetCallerIdentity'
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  id-token: write   # OIDC (token minted as the caller repo)
  contents: read

jobs:
  fetch:
    name: AWS Config -> HDF
    runs-on: ubuntu-latest
    container:
      # v0.1.5 shipped hdf CLI 3.2.0, under which this workflow produced HDF
      # carrying NO tags.nist at all — every AWS Config finding reached the
      # POA&M with no control attribution. v0.5.0 ships 3.4.1, which has
      # been shown to produce them end to end.
      #
      # WHERE the tags were lost is not settled. #5 attributed it to the
      # `--to hdf@1` downgrade, but that step preserves tags under BOTH 3.2.0
      # and 3.4.1 when the input carries them (see the note on #5). The
      # remaining suspect is `hdf fetch aws-config` itself under 3.2.0, which
      # was never tested at that version. The bump fixes the observed symptom
      # either way; the mechanism is recorded as open rather than asserted.
      #
      # Pinned by mutable tag, which is not the org convention (consumers pin by
      # @sha256: and verify the cosign signature). Moving to a digest pin is
      # tracked separately rather than bundled into an evidence fix.
      image: risksentinel/sparc-auditor:v0.5.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(inputs.regions) }}
    steps:
      - name: Configure AWS credentials via OIDC (caller's role)
        id: creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: aws-config-fetch-${{ github.run_id }}-${{ matrix.region }}
          aws-region: ${{ matrix.region }}

      - name: Build passthrough (workload + target identity)
        id: pass
        shell: bash
        env:
          ACCOUNT: ${{ steps.creds.outputs.aws-account-id }}
          REGION: ${{ matrix.region }}
          WORKLOAD: ${{ inputs.workload_name }}
        run: |
          # Stamped into each HDF's passthrough so the evidence self-identifies the
          # workload + AWS account/region it was collected from.
          cat > "passthrough-${REGION}.json" <<JSON
          {
            "workload": "${WORKLOAD}",
            "source": "aws-config",
            "target": {
              "name": "aws-account-${ACCOUNT}",
              "type": "aws_account",
              "account_id": "${ACCOUNT}",
              "region": "${REGION}"
            },
            "collected_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "github_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          echo "account=${ACCOUNT}" >> "$GITHUB_OUTPUT"

      - name: hdf fetch aws-config (primary — target + enrichment)
        shell: bash
        env:
          REGION: ${{ matrix.region }}
          ACCOUNT: ${{ steps.creds.outputs.aws-account-id }}
        run: |
          raw="${{ inputs.output_prefix }}-${ACCOUNT}-${REGION}.raw.json"
          art="${{ inputs.output_prefix }}-${ACCOUNT}-${REGION}.hdf.json"
          hdf fetch aws-config --region "${REGION}" -o "${raw}"
          [ -s "${raw}" ] || { echo "::error::no HDF produced (${raw}) — Config recording + role config:* read?"; exit 1; }
          # Validate the NATIVE fetch output (the hdf CLI validates its own new schema).
          # Informational — don't fail the job on a validate quirk.
          hdf validate "${raw}" || echo "::warning::hdf validate on the native fetch output reported issues"
          # Normalize the hdf-cli schema (baselines[]/requirements[]) down to the legacy
          # profiles[].controls[] HDF that the downstream failure_export / hdf_to_oscal.py
          # pipeline already consumes — no custom shape-handling needed.
          # The .raw.json keeps the richer hdf-cli evidence (not uploaded; the .hdf.json is the
          # pipeline artifact). Going fully hdf-cli-native for OSCAL is a later migration.
          #
          # Do NOT `hdf validate` the downgraded output — the hdf CLI validates only its OWN
          # (new) schema and rejects its own --to hdf@1 legacy form ("baselines is required").
          # The correct check is that the pipeline shape (profiles[].controls[]) is present.
          hdf convert "${raw}" --to hdf@1 -o "${art}"
          [ -s "${art}" ] || { echo "::error::normalize (--to hdf@1) produced no output (${art})"; exit 1; }
          # Stamp the workload/target into the passthrough of the pipeline artifact.
          saf supplement passthrough write -i "${art}" -f "passthrough-${REGION}.json"
          # Assert the pipeline SHAPE and the control ATTRIBUTION.
          #
          # The previous check counted controls and failed only on zero. It
          # therefore passed happily on a file carrying 78 controls and not one
          # NIST tag — it ran, reported green, and verified nothing about
          # the thing that was actually broken. Attribution is the reason this
          # evidence exists: a finding that reaches the POA&M with no control ID
          # cannot be mapped to anything, so an untagged file is not partially
          # useful, it is unusable.
          python3 - "${art}" <<'PY'
          import json, sys

          path = sys.argv[1]
          doc = json.load(open(path))
          profiles = doc.get("profiles") or []
          controls = [c for p in profiles for c in (p.get("controls") or [])]
          tagged = [c for c in controls if (c.get("tags") or {}).get("nist")]
          distinct = {t for c in tagged for t in (c["tags"]["nist"] or [])}

          print(f"normalized {path}: {len(controls)} controls, "
                f"{len(tagged)} NIST-tagged, {len(distinct)} distinct tags")

          if not controls:
              print("::error::normalized HDF has no profiles[].controls[] — "
                    "empty Config results / lossy downgrade?")
              sys.exit(1)

          if not tagged:
              print("::error::normalized HDF carries no tags.nist — control "
                    "attribution is missing, so findings would reach the POA&M "
                    "unmapped (see #5). Check the sparc-auditor image pin "
                    "first: this was last caused by a stale pin. Note the tags "
                    "may be lost at `hdf fetch` rather than at the downgrade, "
                    "so inspect the .raw.json too.")
              sys.exit(1)
          PY

      - name: saf aws_config2hdf (cross-check)
        shell: bash
        env:
          REGION: ${{ matrix.region }}
          ACCOUNT: ${{ steps.creds.outputs.aws-account-id }}
        run: |
          art="${{ inputs.output_prefix }}-${ACCOUNT}-${REGION}.saf.hdf.json"
          saf convert aws_config2hdf -r "${REGION}" -o "${art}"
          [ -s "${art}" ] || { echo "::error::no SAF HDF produced (${art})."; exit 1; }
          saf supplement passthrough write -i "${art}" -f "passthrough-${REGION}.json"
          # SAF emits native legacy profiles[].controls[] HDF — check that shape directly
          # (hdf validate only recognizes the new hdf-cli schema, not this legacy form).
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); n=sum(len(p.get('controls',[])) for p in d.get('profiles',[])); print(f'saf {sys.argv[1]}: {n} controls') if (d.get('profiles') and n>0) else (print('::error::SAF HDF has no profiles[].controls[]') or sys.exit(1))" "${art}"
          echo "saf -> ${art}"

      # The uploaded artifact IS "our output": the caller collects it and its
      # aggregate-failures step feeds the downstream OSCAL/ATO pipeline, which
      # already ingests artifacts of this shape. (S3 archival, if ever wanted, is a
      # separate ubuntu-latest publish job — the scanner image has no aws CLI.)
      - name: Upload HDF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.output_prefix }}-${{ matrix.region }}
          path: ${{ inputs.output_prefix }}-*-${{ matrix.region }}*.hdf.json
          retention-days: 90
