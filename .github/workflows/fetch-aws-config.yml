name: fetch-aws-config

# Capture AWS Config rule-evaluation results as HDF evidence for the ATO package
# (aws-config#1). RETRIEVAL lives here; sparc-validate only INCLUDES the published
# HDF (sparc-validate#194) — it does not re-fetch.
#
# Primary: hdf CLI `fetch aws-config` (mitre/hdf-libs 3.2.0, on PATH in
# sparc-auditor v0.1.5 — sparc-validate#195) — richer target attribution +
# failed-result enrichment. Emits the baselines[]/requirements[] HDF schema.
#
# Cross-check: SAF CLI `aws_config2hdf` — emits the profiles[].controls[] HDF
# schema. Kept in parallel during transition / as a second source.

on:
  schedule:
    - cron: '0 7 * * *'   # nightly ~03:00 ET — aligns with the sparc-validate matrix
  workflow_dispatch:

permissions:
  id-token: write   # OIDC for configure-aws-credentials
  contents: read

jobs:
  fetch:
    name: AWS Config -> HDF
    runs-on: ubuntu-latest
    # Pinned, cosign-signed scanner image (carries both `hdf` 3.2.0 and `saf`).
    # Authenticated pull via the org DOCKERHUB_* secrets — anonymous Docker Hub
    # pulls from shared runner IPs flake on the rate limit (sparc-validate#192/#193).
    container:
      image: risksentinel/sparc-auditor:v0.1.5
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        region: [us-east-1]   # add deployment regions here for multi-region capture
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials via OIDC
        id: creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: aws-config-fetch-${{ github.run_id }}-${{ matrix.region }}
          aws-region: ${{ matrix.region }}

      - name: hdf fetch aws-config (primary — target + enrichment)
        shell: bash
        env:
          ACCOUNT: ${{ steps.creds.outputs.aws-account-id }}
          REGION: ${{ matrix.region }}
        run: |
          # account+region in the filename (provenance); the CLI also stamps the
          # target into the HDF. Creds come from the AWS_* env vars set above.
          art="aws-config-${ACCOUNT}-${REGION}.hdf.json"
          hdf fetch aws-config --region "${REGION}" -o "${art}"
          [ -s "${art}" ] || { echo "::error::no HDF produced (${art}) — is AWS Config recording + does the role have config:* read?"; exit 1; }
          # hdf validate is authoritative for HDF correctness; list confirms content/target.
          hdf validate "${art}"
          hdf list "${art}"
          echo "hdf fetch aws-config -> ${art} (account=${ACCOUNT} region=${REGION})"

      - name: SAF aws_config2hdf (cross-check)
        shell: bash
        env:
          ACCOUNT: ${{ steps.creds.outputs.aws-account-id }}
          REGION: ${{ matrix.region }}
        run: |
          art="aws-config-${ACCOUNT}-${REGION}.saf.hdf.json"
          saf convert aws_config2hdf -r "${REGION}" -o "${art}"
          [ -s "${art}" ] || { echo "::error::no SAF HDF produced (${art})."; exit 1; }
          hdf validate "${art}" || echo "::warning::SAF output failed hdf validate (schema drift vs hdf-cli) — review."
          echo "saf aws_config2hdf -> ${art}"

      - name: Upload HDF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aws-config-${{ matrix.region }}
          path: aws-config-*-${{ matrix.region }}*.hdf.json
          retention-days: 90

  publish:
    name: publish rolling 'latest' release (stable URL for the include)
    needs: fetch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest   # NOT the scanner image — it has no `gh`
    permissions:
      contents: write   # create/update the release
    steps:
      - uses: actions/checkout@v6

      - name: Download HDF artifacts
        uses: actions/download-artifact@v8
        with:
          path: hdf/

      - name: Update the 'latest' release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find hdf/ -name 'aws-config-*.hdf.json' | sort)
          [ -n "${files}" ] || { echo "::error::no HDF artifacts to publish"; exit 1; }
          # Rolling 'latest' release = a stable URL sparc-validate#194 can
          # `gh release download latest` from; assets are replaced each run.
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest \
                 --title "Latest AWS Config evidence (HDF)" \
                 --notes "Rolling-latest AWS Config rule-evaluation results in HDF (hdf-cli primary + SAF cross-check), refreshed each run. Consumed by sparc-validate#194."
          gh release upload latest ${files} --clobber
          echo "Published $(echo "${files}" | wc -l | tr -d ' ') HDF asset(s) to the 'latest' release."
