name: SonarQube HDF emit

# This repo's caller for container-build-sign's reusable sonarqube-hdf.yml
# (aws-config#6) — fetch aws-config's SonarCloud findings, convert to OASIS
# Heimdall Data Format (OHDF), and bake the HDF into the org security-artifacts
# bucket so SAST joins the same unified compliance-evidence stream Heimdall
# aggregates alongside InSpec/cinc, checkov and SCA.
#
# Mirrors sparc-validate's and sparc-dast's callers so all four repos consume one
# converter with one configuration.
#
# ---- This FETCHES; it does not ANALYSE --------------------------------------
#
# SonarCloud analysis itself runs via the SonarCloud GitHub App (automatic
# analysis). Nothing in this organisation runs a scanner step, so no workflow
# here can cause an analysis to happen — this job only collects results after
# the fact.
#
# That matters for THIS repository specifically: as of aws-config#5 the project
# `risk-sentinel_aws-config` exists but has NEVER been analysed. Until automatic
# analysis is enabled in SonarCloud (or it is accepted that there is no
# analysable source here and the project is removed), this job has nothing to
# fetch. It is wired now so the evidence flows the moment that is resolved,
# rather than being remembered later.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_saf:
        description: 'Override: use the SAF CLI bridge instead of hdf-cli for this run.'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write          # AWS OIDC for the S3 emit (passed through to the reusable)

jobs:
  emit:
    uses: risk-sentinel/container-build-sign/.github/workflows/sonarqube-hdf.yml@f866513351f6d0678788510c876516eb5ecb9f31  # main @ 2026-07-09 (no reusables tag covers the sonar reusable yet — container-build-sign#87)
    with:
      sonar_project_key: risk-sentinel_aws-config
      sonar_organization: risk-sentinel
      repo_slug: aws-config
      boundary: ${{ vars.EVIDENCE_BOUNDARY || 'sparc' }}
      # Default = hdf-cli. The org variable flips every repo to the SAF bridge
      # together (parity); the workflow_dispatch input overrides for a one-off.
      use_saf: ${{ inputs.use_saf || vars.SONARQUBE_HDF_USE_SAF == 'true' }}
    secrets:
      # Read-scoped SonarCloud token (org secret, visible to all repos).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Dedicated aws-config evidence-emit role: OIDC-assumable by this repo,
      # s3:PutObject scoped to sonarqube/aws-config/* in the security bucket.
      # NOT YET PROVISIONED — the secret resolves empty, and the reusable then
      # converts + validates but skips the upload (gated, no failure). Named
      # here so the intended secret is documented rather than invented later,
      # mirroring how sparc-validate's caller was wired ahead of its role.
      S3_EMIT_ROLE_ARN: ${{ secrets.AWSCONFIG_SONAR_EMIT_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
